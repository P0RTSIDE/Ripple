<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ripple</title>
    <link rel="stylesheet" href="style.css?v=20260812av" />
</head>
<body>
    <!-- The whole experience is a single full-viewport canvas surface. -->
    <canvas id="surface"></canvas>

    <!-- Hide / show all on-screen menus. Stays available when the rest of the UI is off. -->
    <button id="ui-toggle" type="button" aria-label="Hide menus" title="Hide menus" aria-pressed="false">
        <span class="ico ico-ui"></span>
    </button>

    <!-- Minimal mode toggle, tucked top-right, low opacity until hovered. -->
    <button id="mode-toggle" type="button" aria-label="Switch between window and pond" title="Switch surface">
        <span id="mode-icon"></span>
    </button>

    <!-- Spendable gold collected from settled gold fish. -->
    <div id="gold-counter" aria-live="polite" title="Gold">
        <span class="ico ico-gold"></span>
        <span id="gold-count">0</span>
    </div>

    <!-- Pond tools; looks menu holds aesthetic toggles. -->
    <div id="pond-controls" aria-label="Pond options">
        <div id="looks-wrap">
            <button type="button" id="looks-btn" class="scenery-btn" title="Pond looks" aria-pressed="false" aria-expanded="false" aria-controls="looks-panel">
                <span class="ico ico-looks"></span>
            </button>
            <div id="looks-panel" aria-label="Pond looks" aria-hidden="true">
                <button type="button" class="scenery-btn on" data-scenery="stones" title="Shore stones" aria-pressed="true">
                    <span class="ico ico-stone"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="sticks" title="Fallen sticks" aria-pressed="true">
                    <span class="ico ico-stick"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="reeds" title="Reeds" aria-pressed="true">
                    <span class="ico ico-reed"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="lilies" title="Lily pads" aria-pressed="true">
                    <span class="ico ico-lily"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="cattails" title="Cattails" aria-pressed="true">
                    <span class="ico ico-cattail"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="duckweed" title="Duckweed and leaves" aria-pressed="true">
                    <span class="ico ico-duckweed"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="debris" title="Lake debris (drag with right click)" aria-pressed="true">
                    <span class="ico ico-debris"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="bed" title="Pond bed" aria-pressed="true">
                    <span class="ico ico-bed"></span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="sun" title="Sun pond" aria-pressed="true">
                    <span class="ico ico-sun"></span>
                </button>
                <button type="button" id="night-btn" class="scenery-btn locked" title="Moon pond: unlock by making a platinum fish" aria-pressed="false" aria-disabled="true">
                    <span class="ico ico-moon"></span>
                    <span id="night-lock">Pt</span>
                </button>
                <button type="button" id="crystal-btn" class="scenery-btn locked" title="Crystal Depths: unlock moon pond first, then make platinum fish under moonlight" aria-pressed="false" aria-disabled="true">
                    <span class="ico ico-crystal"></span>
                    <span id="crystal-lock">3Pt</span>
                </button>
                <button type="button" class="scenery-btn on" data-scenery="frogs" title="Swimming frogs and tadpoles" aria-pressed="true">
                    <span class="ico ico-frog"></span>
                </button>
                <button type="button" id="hats-btn" class="locked" title="Hats: 5 gold fish" aria-disabled="true" aria-pressed="false">
                    <span class="ico ico-hat"></span>
                    <span id="hats-cost">5</span>
                </button>
            </div>
        </div>
        <button type="button" id="net-btn" class="scenery-btn" title="Net: scoop food with right click" aria-pressed="false">
            <span class="ico ico-net"></span>
        </button>
        <button type="button" id="market-btn" class="locked" title="Market: 7 gold fish" aria-disabled="true" aria-pressed="false">
            <span class="ico ico-market"></span>
            <span id="market-cost">7</span>
        </button>
        <button type="button" id="registry-btn" class="scenery-btn" title="Fish registry" aria-pressed="false" aria-expanded="false" aria-controls="registry-panel">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h10v2H4v-2zm0 6h16v2H4v-2zm13-7.5l4 2.5-4 2.5v-5z"/></svg>
        </button>
        <button type="button" id="progress-btn" class="scenery-btn" title="Save progress" aria-pressed="false">
            <span class="ico ico-save"></span>
        </button>
        <button type="button" id="catcher-btn" class="scenery-btn" title="Rainbow catcher" aria-pressed="false">
            <span class="ico ico-catcher"></span>
        </button>
        <button type="button" id="picker-btn" class="scenery-btn" title="Fish picker" aria-pressed="false" hidden>
            <span class="ico ico-picker"></span>
        </button>
        <button type="button" id="tunes-btn" class="scenery-btn" title="Tunes" aria-pressed="false" aria-expanded="false" aria-controls="tunes-panel">
            <span class="ico ico-tunes"></span>
        </button>
        <button type="button" id="ambient-btn" class="scenery-btn" title="Ambient bed off" aria-label="Toggle ambient bed" aria-pressed="false">
            <span class="ico ico-ambient"></span>
        </button>
        <label id="sound-level" title="Sound level">
            <span class="ico ico-vol" aria-hidden="true"></span>
            <input type="range" id="sound-level-slider" min="0" max="100" value="90" step="1" aria-label="Sound level" />
        </label>
        <button type="button" id="drop-sound-btn" title="Drop sound: soft" aria-label="Cycle drop sound">
            <span class="ico ico-sound"></span>
            <span id="drop-sound-label">soft</span>
        </button>
    </div>

    <!-- Window mode: rhythm studio for glass loops you can save and play in the pond. -->
    <div id="window-controls" aria-label="Window options">
        <button type="button" id="rhythm-btn" class="scenery-btn" title="Rhythm studio" aria-pressed="false" aria-expanded="false" aria-controls="rhythm-panel">
            <span class="ico ico-rhythm"></span>
        </button>
    </div>

    <div id="rhythm-panel" aria-label="Rhythm studio" aria-hidden="true">
        <div class="market-meta">
            <span>Rhythm studio</span>
            <span id="rhythm-step-label">1 / 16</span>
        </div>
        <div class="rhythm-transport">
            <button type="button" id="rhythm-play" class="market-row rhythm-mini">Play</button>
            <button type="button" id="rhythm-stop" class="market-row rhythm-mini">Stop</button>
            <button type="button" id="rhythm-record" class="market-row rhythm-mini" aria-pressed="false">Record</button>
            <button type="button" id="rhythm-clear" class="market-row rhythm-mini">Clear</button>
        </div>
        <label class="rhythm-bpm-wrap" title="Tempo">
            <span>Tempo</span>
            <input type="range" id="rhythm-bpm" min="60" max="140" value="96" step="1" aria-label="Tempo" />
            <span id="rhythm-bpm-val">96</span>
        </label>
        <div id="rhythm-grid" class="rhythm-grid" aria-label="Step grid"></div>
        <div class="rhythm-save-row">
            <input type="text" id="rhythm-name" maxlength="28" placeholder="Tune name" aria-label="Tune name" />
            <button type="button" id="rhythm-save" class="market-row rhythm-mini">Save</button>
        </div>
        <div id="rhythm-library" class="rhythm-library" aria-label="Saved tunes"></div>
    </div>

    <!-- Pond: play saved window tunes softly under the pond. -->
    <div id="tunes-panel" aria-label="Tunes" aria-hidden="true">
        <div class="market-meta">
            <span>Saved tunes</span>
            <button type="button" id="tunes-stop" class="market-row rhythm-mini">Stop</button>
        </div>
        <div id="tunes-library" class="rhythm-library" aria-label="Pond tune list"></div>
        <p id="tunes-empty" class="rhythm-empty">No saved tunes yet. Make one on the glass surface.</p>
    </div>

    <!-- Quiet market: few buy rows, same faint corner feel as other pond chrome. -->
    <div id="market-panel" aria-label="Market" aria-hidden="true">
        <div class="market-meta">
            <span><span id="market-gold">0</span> gold</span>
            <span><span id="market-food">0</span> food</span>
        </div>
        <button type="button" id="market-buy-magnet" class="market-row" disabled>Magnet · 3 gold</button>
        <button type="button" id="market-buy-catcher" class="market-row" disabled>Rainbow catcher · 4 gold</button>
        <button type="button" id="market-buy-catcher-up" class="market-row" disabled hidden>Wider catcher · 3 rainbow food</button>
        <button type="button" id="market-buy-picker" class="market-row" disabled>Fish picker · 3 rainbow food</button>
        <button type="button" id="market-buy-double-petter" class="market-row" disabled hidden>Double petter · 5 rainbow food</button>
        <button type="button" id="market-buy-rainbow" class="market-row" disabled>Rainbow food · 10 gold</button>
        <button type="button" id="market-buy-goldfood" class="market-row" disabled>Gold food · 20 fish food</button>
        <button type="button" id="market-buy-recipe-mirror" class="market-row" disabled>Mirror craft · gold + breed food</button>
        <button type="button" id="market-buy-recipe-storm" class="market-row" disabled>Storm craft · rainbow + grower</button>
        <button type="button" id="market-buy-recipe-night" class="market-row" disabled>Moon pond · 5 rainbow food</button>
        <button type="button" id="market-buy-platinum" class="market-row" disabled hidden>Platinum food · 5 rainbow food</button>
    </div>

    <!-- Free local progress: stays in this browser, or download a file. No account. -->
    <div id="registry-panel" aria-label="Fish registry" aria-hidden="true">
        <div class="registry-head">
            <span>Fish registry</span>
            <span id="registry-count">0 / 0</span>
        </div>
        <p id="registry-blurb" class="registry-blurb">Entries stay dark until you meet them in the pond.</p>
        <div id="registry-tabs" class="registry-tabs" role="tablist" aria-label="Registry groups"></div>
        <div id="registry-grid" class="registry-grid" role="list"></div>
        <div id="registry-detail" class="registry-detail" aria-live="polite"></div>
    </div>

    <div id="progress-panel" aria-label="Progress" aria-hidden="true">
        <div class="market-meta">
            <span id="progress-status">Not saved this visit</span>
        </div>
        <button type="button" id="progress-save" class="market-row">Save progress</button>
        <button type="button" id="progress-load" class="market-row" disabled>Load progress</button>
        <button type="button" id="progress-download" class="market-row">Download save file</button>
        <button type="button" id="progress-upload" class="market-row">Upload save file</button>
        <button type="button" id="progress-new" class="market-row">New pond</button>
        <input type="file" id="progress-file" accept="application/json,.json" hidden />
    </div>

    <!-- Food saved from the net: click a pellet, then click the pond to drop it. -->
    <div id="food-stash" aria-label="Saved food" aria-hidden="true"></div>

    <!-- Secret developer tools: type "dev code fartgoblin" to open. -->
    <div id="dev-panel" aria-label="Dev menu" aria-hidden="true"></div>

    <!-- On-load hint that fades out after the first interaction and never returns. -->
    <div id="hint">click anywhere</div>

    <script src="main.js?v=20260812bc"></script>
</body>
</html>
